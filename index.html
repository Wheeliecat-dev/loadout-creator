<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loadout Creator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1 class="app-title">Loadout Creator</h1>
    <nav class="group-nav" id="group-nav"></nav>
    <div class="sidebar-actions">
      <button id="reset-btn" class="btn btn-secondary">Reset Loadout</button>
      <button id="admin-toggle-btn" class="btn btn-secondary">Admin Mode</button>
    </div>
  </aside>

  <main class="stage-panel">
    <div class="stage-wrap">
      <div class="stage-controls">
        <div class="view-toggle" id="view-toggle">
          <button class="view-btn active" data-view="front">Front</button>
          <button class="view-btn" data-view="rear">Rear</button>
        </div>
        <div class="zoom-controls" id="zoom-controls">
          <button class="zoom-btn" id="zoom-out" title="Zoom out">&minus;</button>
          <span id="zoom-level">100%</span>
          <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
        </div>
      </div>
      <div id="stage" class="stage">
        <div id="stage-content" class="stage-content"></div>
      </div>
      <div id="admin-panel" class="admin-panel" hidden>
        <p class="admin-hint">Pick a layer below, then drag on the stage to move it or scroll to scale it.</p>
        <div id="admin-layer-list" class="admin-layer-list"></div>
        <div class="admin-row">
          <label>Item</label>
          <span id="admin-item-name">&mdash;</span>
        </div>
        <div class="admin-row">
          <label>X</label>
          <input type="number" id="admin-x" step="0.5" disabled>
        </div>
        <div class="admin-row">
          <label>Y</label>
          <input type="number" id="admin-y" step="0.5" disabled>
        </div>
        <div class="admin-row">
          <label>Scale</label>
          <input type="number" id="admin-scale" step="0.01" disabled>
        </div>
        <p class="admin-hint admin-hint-grading">Color grading — nudge toward a common palette</p>
        <div class="admin-row">
          <label>Hue</label>
          <input type="number" id="admin-hue" step="1" disabled>
        </div>
        <div class="admin-row">
          <label>Saturate</label>
          <input type="number" id="admin-saturate" step="0.05" disabled>
        </div>
        <div class="admin-row">
          <label>Bright</label>
          <input type="number" id="admin-brightness" step="0.05" disabled>
        </div>
        <div class="admin-row">
          <label>Shadow</label>
          <input type="range" id="admin-shadow" min="0" max="1" step="0.05" disabled>
          <span id="admin-shadow-value" class="admin-range-value"></span>
        </div>
        <div class="admin-row">
          <label>Spread</label>
          <input type="range" id="admin-spread" min="0" max="20" step="0.5" disabled>
          <span id="admin-spread-value" class="admin-range-value"></span>
        </div>
        <div class="admin-row admin-buttons">
          <button id="admin-reset-item-btn" class="btn btn-secondary" disabled>Reset item</button>
          <button id="admin-save-btn" class="btn">Save site-wide</button>
        </div>
        <p id="admin-save-status" class="admin-status"></p>
      </div>
    </div>
  </main>

  <section class="items-panel">
    <div id="slots-container"></div>
  </section>
</div>

<template id="item-tile-template">
  <div class="item-tile" tabindex="0">
    <div class="item-thumb"><img alt=""></div>
    <div class="item-name"></div>
  </div>
</template>

<script src="data/items.js"></script>
<script src="data/itemTransforms.js"></script>
<script src="script.js"></script>
</body>
</html>
